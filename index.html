<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Programmer <span style="color: lightseagreen
    ">Quiz</span></h1>
    <div class="main-container">
        <div class="question-container">
            <h2>Which keyword is used to declare a variable that cannot be reassigned?</h2>
        </div>
        <div class="answer-container">
            <div class="answerbox box-a">
                <p class="question-box">var</p>
            </div>
            <div class="answerbox box-b">
                <p>let</p>
            </div>
            <div class="answerbox box-c">
                <p>const</p>
            </div>
            <div class="answerbox box-d">
                <p>define</p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
